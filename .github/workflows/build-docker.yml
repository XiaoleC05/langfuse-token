name: Build Docker Image and Publish to Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f web/Dockerfile -t langfuse-token-web:latest .
          docker save langfuse-token-web:latest | gzip > langfuse-token-web.tar.gz
          ls -lh langfuse-token-web.tar.gz

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="docker-$(date +%Y%m%d%H%M%S)"
          gh release create "$TAG" langfuse-token-web.tar.gz \
            --title "Docker Image ${GITHUB_SHA::7}" \
            --notes "langfuse-token-web Docker image. Commit: ${GITHUB_SHA}" \
            --target ${{ github.sha }} \
            --latest
