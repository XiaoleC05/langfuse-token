name: Build Docker Image and Publish to Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# 连续推送时取消旧构建，避免 runner 浪费和 latest 标签竞争
concurrency:
  group: build-docker
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        # Umami 统计脚本：NEXT_PUBLIC 变量构建期内联（值公开，非机密）
        env:
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ac9420c0-fc6d-44ae-8a27-13903bf795d3
          NEXT_PUBLIC_UMAMI_SRC: https://stats.oxelia51.com/script.js
        run: |
          docker build -f web/Dockerfile -t langfuse-token-web:latest \
            --build-arg NEXT_PUBLIC_UMAMI_WEBSITE_ID="$NEXT_PUBLIC_UMAMI_WEBSITE_ID" \
            --build-arg NEXT_PUBLIC_UMAMI_SRC="$NEXT_PUBLIC_UMAMI_SRC" \
            .
          docker save langfuse-token-web:latest | gzip > langfuse-token-web.tar.gz
          ls -lh langfuse-token-web.tar.gz

      - name: Push to Aliyun ACR
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          docker tag langfuse-token-web:latest "$ACR_REGISTRY/oxelia51/langfuse-token:latest"
          echo "$ACR_PASSWORD" | docker login --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"
          docker push "$ACR_REGISTRY/oxelia51/langfuse-token:latest"
          echo "PUSH_DONE"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="docker-$(date +%Y%m%d%H%M%S)"
          gh release create "$TAG" langfuse-token-web.tar.gz \
            --title "Docker Image ${GITHUB_SHA::7}" \
            --notes "langfuse-token-web Docker image. Commit: ${GITHUB_SHA}" \
            --target ${{ github.sha }} \
            --latest

